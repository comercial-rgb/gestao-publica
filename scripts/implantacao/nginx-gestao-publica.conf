# nginx — Gestão Pública (gestaopublica.enginesistemas.com.br). Copiar para
# /etc/nginx/sites-available/gestao-publica, ligar em sites-enabled e emitir o certificado com
#   sudo certbot --nginx -d gestaopublica.enginesistemas.com.br
# O certbot acrescenta o bloco 443 e o redirecionamento de 80 para HTTPS.
#
# O Next escuta só em 127.0.0.1:3000 (a unit passa -H 127.0.0.1): ninguém chega à aplicação sem
# passar por aqui.

# O destino (upstream gestao_publica) mora em /etc/nginx/conf.d/gestao-publica-upstream.conf: o
# atualizar-no-servidor.sh o reescreve a cada versão (porta 3000 ou 3001) e recarrega o nginx sem queda.

server {
  listen 80;
  listen [::]:80;
  server_name gestaopublica.enginesistemas.com.br;

  # Planilhas e anexos (o limite da server action é 8 MB; aqui um pouco acima).
  client_max_body_size 12m;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    proxy_pass http://gestao_publica;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Relatórios em PDF e a geração do orçamento podem levar até dois minutos.
    proxy_read_timeout 180s;
  }
}
